name: songs.json 同期（サーバーアップロード）

on:
  workflow_dispatch:
  schedule:
    # JST 12:00 = UTC 03:00
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: sync-songs-to-r2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate required secrets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_OBJECT_KEY: ${{ secrets.R2_OBJECT_KEY }}
          GAS_SONGS_API_URL: ${{ secrets.GAS_SONGS_API_URL || 'https://script.google.com/macros/s/AKfycbyR0J5IjXT7lZjDT7SAIkM4TW8SP1k0iNy3wW0Q2YhIGON6ugsvdffm0zYI1cJzgIoP/exec?api=songs' }}
        run: |
          set -euo pipefail

          access_key="${R2_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}"
          secret_key="${R2_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}"

          if [[ -z "$access_key" || -z "$secret_key" ]]; then
            echo "Missing credentials. Set either R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY secrets." >&2
            exit 1
          fi

          missing_vars=()
          [[ -z "${R2_ACCOUNT_ID:-}" ]] && missing_vars+=("R2_ACCOUNT_ID")
          [[ -z "${R2_BUCKET:-}" ]] && missing_vars+=("R2_BUCKET")
          [[ -z "${R2_OBJECT_KEY:-}" ]] && missing_vars+=("R2_OBJECT_KEY")

          if (( ${#missing_vars[@]} > 0 )); then
            echo "Missing required R2 config secrets: ${missing_vars[*]}" >&2
            exit 1
          fi

          if [[ "$GAS_SONGS_API_URL" != https://* ]]; then
            echo "GAS_SONGS_API_URL must start with https://" >&2
            exit 1
          fi

      - name: Build and validate songs snapshot
        env:
          GAS_SONGS_API_URL: ${{ secrets.GAS_SONGS_API_URL || 'https://script.google.com/macros/s/AKfycbyR0J5IjXT7lZjDT7SAIkM4TW8SP1k0iNy3wW0Q2YhIGON6ugsvdffm0zYI1cJzgIoP/exec?api=songs' }}
          SNAPSHOT_FILE: songs.generated.json
          SYNC_TIMEOUT_MS: '15000'
          SYNC_MAX_RETRIES: '5'
        run: node scripts/build_songs_snapshot.mjs

      - name: Upload and verify songs snapshot
        env:
          SNAPSHOT_FILE: songs.generated.json
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_OBJECT_KEY: ${{ secrets.R2_OBJECT_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          # Cloudflare R2 upload uses endpoint-url and static credentials.
          # Keep AWS SDK/CLI region on a real AWS region value to avoid
          # accidental lookups such as sts.auto.amazonaws.com.
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          UPLOAD_MAX_ATTEMPTS: '3'
        run: bash scripts/sync_songs_to_r2.sh
